<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voting Machine</title>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
.container{max-width:900px;margin:auto;padding:20px}
.card{background:#fff;padding:20px;border-radius:10px;margin-bottom:20px}
.hidden{display:none}

.party{
width:100%;
height:100px;
margin:10px 0;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
font-weight:bold;
cursor:pointer;
font-size:18px;
}

.symbol img{
width:70px;height:70px;
background:#fff;border-radius:8px;
}

.tvk{background:linear-gradient(red 33%, yellow 33%, yellow 66%, red 66%);color:black;}
.ntk{background:green;color:white;}
.bjp{background:linear-gradient(orange 50%, green 50%);color:black;}
.aiadmk{background:linear-gradient(black 33%, white 33%, white 66%, red 66%);color:black;}
.dmk{background:linear-gradient(red 50%, black 50%);color:white;}
.congress{background:linear-gradient(orange 33%, white 33%, white 66%, green 66%);color:black;}

.result-item{
padding:10px;margin:6px 0;border-radius:6px;background:#eee;font-size:18px;
}
.top1{background:gold;}
.top2{background:silver;}
.top3{background:#cd7f32;color:white;}

button{padding:10px;border:none;border-radius:6px;cursor:pointer}
.admin-btn{background:#222;color:#fff;}
.clear-btn{background:red;color:#fff;margin-top:10px;}
</style>
</head>

<body>
<div class="container">

<div id="login" class="card">
<h2>Vote Login</h2>
<input id="name" placeholder="Name"><br><br>
<input id="phone" placeholder="Phone"><br><br>
<input id="pass" type="password" placeholder="Password"><br><br>
<button onclick="login()">Enter</button>
</div>

<div id="votePage" class="card hidden">
<h2>Select Party</h2>
<div id="parties"></div>
</div>

<div class="card">
<h3>Admin Panel</h3>
<button class="admin-btn" onclick="adminAccess()">View Results</button>
</div>

<div id="resultPage" class="card hidden">
<h2>🏆 Winners</h2>
<div id="results"></div>
<button class="clear-btn" onclick="clearVotes()">Clear Votes</button>
</div>

</div>

<script>

const parties=[
{name:"TVK",class:"tvk",logo:"https://pbs.twimg.com/media/G_Qbc9sWEAAINa1.png "},
{name:"NTK",class:"ntk",logo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTlDClR8J3uGe0kQObGwbeg2wYZrvCAeCWzWw&s"},
{name:"BJP",class:"bjp",logo:"https://upload.wikimedia.org/wikipedia/commons/e/e8/BJP_election_symbol.png"},
{name:"AIADMK",class:"aiadmk",logo:"https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/AIADMK_Two_Leaves.png/1280px-AIADMK_Two_Leaves.png"},
{name:"DMK",class:"dmk",logo:"https://hindi.starsunfolded.com/wp-content/uploads/2018/08/DMK.jpg"},
{name:"CONGRESS",class:"congress",logo:"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d9/INC_Hand.svg/500px-INC_Hand.svg.png"}
];

let votes=JSON.parse(localStorage.getItem("votes"))||{};
let voters=JSON.parse(localStorage.getItem("voters"))||{};

function login(){
let name=document.getElementById("name").value.trim();
let phone=document.getElementById("phone").value.trim();
let pass=document.getElementById("pass").value.trim();

if(!name||!phone||!pass){
alert("Fill all fields");
return;
}

/* ✅ FINAL WORKING VALIDATION */
phone = phone.replace(/\D/g,''); // remove non-numbers

if(phone.length !== 10){
alert("Phone number must be exactly 10 digits");
return;
}

if(pass!=="12345"){
alert("Wrong password");
return;
}

if(voters[phone]){
alert("Already voted");
return;
}

localStorage.setItem("user",JSON.stringify({name,phone}));

document.getElementById("login").classList.add("hidden");
document.getElementById("votePage").classList.remove("hidden");

showParties();
}

function showParties(){
let container=document.getElementById("parties");
container.innerHTML="";

parties.forEach(p=>{
let div=document.createElement("div");
div.className="party "+p.class;

div.innerHTML=`
<div>
${p.name}<br>
<small>➡️ Click to vote</small>
</div>
<div class="symbol"><img src="${p.logo}"></div>
`;

div.onclick=()=>vote(p.name);
container.appendChild(div);
});
}

function vote(party){
if(!confirm("Vote for "+party+" ?")) return;

let user=JSON.parse(localStorage.getItem("user"));

votes[party]=(votes[party]||0)+1;
voters[user.phone]=true;

localStorage.setItem("votes",JSON.stringify(votes));
localStorage.setItem("voters",JSON.stringify(voters));

alert("SUCCESSFULLY VOTED ✅");
location.reload();
}

function adminAccess(){
let pass=prompt("Enter Admin Password:");
if(pass!=="admin12345"){
alert("Wrong password");
return;
}

document.getElementById("resultPage").classList.remove("hidden");
showResults();
}

function showResults(){
let sorted=Object.entries(votes).sort((a,b)=>b[1]-a[1]);

let resultDiv=document.getElementById("results");
resultDiv.innerHTML="";

sorted.forEach((item,index)=>{
let div=document.createElement("div");

let cls="";
if(index==0) cls="top1";
else if(index==1) cls="top2";
else if(index==2) cls="top3";

div.className="result-item "+cls;
div.innerHTML=`${index+1}. ${item[0]} - ${item[1]} votes`;

resultDiv.appendChild(div);
});
}

function clearVotes(){
if(!confirm("Clear all votes?")) return;

localStorage.clear();
alert("Votes cleared");
location.reload();
}

</script>

</body>
</html>
